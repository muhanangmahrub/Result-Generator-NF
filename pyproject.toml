[project]
name = "result-test-generator"
version = "0.1.0"
description = "Buat dokumen Result Test UAT (Word) dari file skenario Excel beserta screenshot per test case."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "PySide6>=6.6",
    "mss>=9.0",
    "Pillow>=10.0",
    "pynput>=1.7",
]

[project.optional-dependencies]
# Export PDF lewat Microsoft Word; tanpa ini LibreOffice tetap bisa dipakai.
pdf = ['pywin32>=306; sys_platform == "win32"']
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
